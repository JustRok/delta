    <script>
      (function() {
    const noticeKey = &#39;deltaruneAudioRemovedNoticeShown&#39;;
    const noticeMessage = &#39;audio removed since dmacs will shut me down&#39;;

    try {
      if (localStorage.getItem(noticeKey) !== &#39;true&#39;) {
        alert(noticeMessage);
        localStorage.setItem(noticeKey, &#39;true&#39;);
      }
    } catch (error) {
      alert(noticeMessage);
    }

    const OriginalAudioContext = window.AudioContext || window.webkitAudioContext;
    if (OriginalAudioContext) {
      const originalCreateGain = OriginalAudioContext.prototype.createGain;

      class SilentAudioContext extends OriginalAudioContext {
        constructor() {
          super(...arguments);
          const silence = originalCreateGain.call(this);
          silence.gain.value = 0;
          silence.connect(super.destination);
          this._silentDestination = silence;
        }
        get destination() {
          return this._silentDestination;
        }
      }
      window.AudioContext = SilentAudioContext;
      window.webkitAudioContext = SilentAudioContext;
    }
    const originalPlay = HTMLMediaElement.prototype.play;
    HTMLMediaElement.prototype.play = function() {
      this.muted = true;
      this.volume = 0;
      return originalPlay.call(this);
    };
    const OriginalAudio = window.Audio;
    window.Audio = function() {
      const audio = new OriginalAudio(...arguments);
      audio.muted = true;
      audio.volume = 0;
      return audio;
    };
    window.Audio.prototype = OriginalAudio.prototype;
  })();

    <script>
      let gamestarted = false;
    function updateButton() {}
    function loadChapter(chapter) {
      const chapterPath = `chapter${chapter}/`;
      fetch(`${chapterPath}index.html`).then(res =&gt; {
        if (!res.ok) {
          throw new Error(`Failed to load ${chapterPath}index.html`);
        }
        return res.text();
      }).then(html =&gt; {
        gamestarted = true;
        const chapterDocument = new DOMParser().parseFromString(html, &#39;text/html&#39;);
        let base = chapterDocument.querySelector(&#39;base&#39;);
        if (!base) {
          base = chapterDocument.createElement(&#39;base&#39;);
          chapterDocument.head.prepend(base);
        }
        base.href = new URL(chapterPath, window.location.href).href;
        document.documentElement.innerHTML = chapterDocument.documentElement.innerHTML;
        document.documentElement.querySelectorAll(&#39;script&#39;).forEach(oldScript =&gt; {
          const newScript = document.createElement(&#39;script&#39;);
          if (oldScript.src) {
            newScript.src = oldScript.src;
          } else {
            newScript.textContent = oldScript.textContent;
          }
          document.body.appendChild(newScript);
        });
      }).catch(error =&gt; {
        console.error(error);
        window.location.href = `${chapterPath}index.html`;
      });
    }
    document.querySelectorAll(&#39;.row&#39;).forEach(row =&gt; {
      row.addEventListener(&#39;mouseenter&#39;, () =&gt; {
        if (!gamestarted) {
          if (selectedChapter) {
            document.querySelectorAll(&#39;.row&#39;)[selectedChapter].classList.remove(&#34;selected&#34;);
          }
        }
      });
    });
    let selectedChapter = null;
    document.addEventListener(&#39;keydown&#39;, function(event) {
      if (!gamestarted) {
      if (event.key === &#39;ArrowUp&#39;) {
        if (selectedChapter === null) {
          selectedChapter = 0;
          document.querySelectorAll(&#39;.row&#39;)[0].classList.add(&#34;selected&#34;);
        } else {
          document.querySelectorAll(&#39;.row&#39;)[selectedChapter].classList.remove(&#34;selected&#34;);
          selectedChapter--;
          if (selectedChapter &lt; 0) {
            selectedChapter = document.querySelectorAll(&#39;.row&#39;).length - 1;
          }
          document.querySelectorAll(&#39;.row&#39;)[selectedChapter].classList.add(&#34;selected&#34;);
        }
      } else if (event.key === &#39;ArrowDown&#39;) {
        if (selectedChapter === null) {
          selectedChapter = 0;
          document.querySelectorAll(&#39;.row&#39;)[0].classList.add(&#34;selected&#34;);
        } else {
          if (selectedChapter+1 &gt;= document.querySelectorAll(&#39;.row&#39;).length) {
            document.querySelectorAll(&#39;.row&#39;)[selectedChapter].classList.remove(&#34;selected&#34;);
            selectedChapter = 0;
            document.querySelectorAll(&#39;.row&#39;)[0].classList.add(&#34;selected&#34;);
          } else {
            document.querySelectorAll(&#39;.row&#39;)[selectedChapter].classList.remove(&#34;selected&#34;);
            selectedChapter++;
            document.querySelectorAll(&#39;.row&#39;)[selectedChapter].classList.add(&#34;selected&#34;);
          }
        }
      } else if (event.key === &#39;Enter&#39;) {
        if (selectedChapter !== null) {
          window.location.href = document.querySelectorAll(&#39;.row&#39;)[selectedChapter].href;
        }
      }
      }
    });
